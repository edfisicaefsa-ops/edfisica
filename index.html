<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educación Física EFSA</title>
    
    <!-- Configuración PWA para instalar en celulares -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EFSA">
    <link rel="apple-touch-icon" href="icon.svg">

    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --border: #334155;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 1rem;
        }

        header {
            width: 100%;
            max-width: 960px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-badge {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #0f172a;
            font-weight: 900;
            padding: 0.45rem 0.75rem;
            border-radius: 8px;
            font-size: 1.1rem;
            letter-spacing: 0.05em;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .btn-outline {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .btn-outline:hover {
            background: rgba(56, 189, 248, 0.12);
        }

        .main-grid {
            width: 100%;
            max-width: 960px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .gender-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .gender-btn {
            background: var(--bg-primary);
            border: 2px solid var(--border);
            color: var(--text-secondary);
            padding: 0.75rem;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .gender-btn.active {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.12);
            color: var(--text-primary);
        }

        select, input[type="text"] {
            width: 100%;
            background: var(--bg-primary);
            border: 2px solid var(--border);
            color: var(--text-primary);
            padding: 0.8rem 1rem;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input[type="text"]:focus {
            border-color: var(--accent);
        }

        .helper-text {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.4rem;
        }

        /* Panel de Resultado */
        .result-box {
            margin-top: 1.5rem;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .result-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
        }

        .grade-display {
            font-size: 4.25rem;
            font-weight: 800;
            line-height: 1.1;
            margin: 0.25rem 0;
            color: var(--text-secondary);
        }

        .grade-status {
            display: inline-block;
            padding: 0.3rem 0.85rem;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-top: 0.35rem;
            background: rgba(148, 163, 184, 0.15);
            color: var(--text-secondary);
        }

        .grade-detail {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.75rem;
        }

        /* Tabla Lateral */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            padding: 0.6rem 0.75rem;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: var(--bg-primary);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tr.highlight-row {
            background: rgba(56, 189, 248, 0.18);
            font-weight: 700;
            color: var(--accent);
        }

        tr.highlight-row-zero {
            background: rgba(239, 68, 68, 0.18);
            font-weight: 700;
            color: var(--danger);
        }

        /* Modal Baremos Completos */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 50;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 850px;
            width: 100%;
            max-height: 88vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }

        @media (max-width: 700px) {
            .modal-body {
                grid-template-columns: 1fr;
            }
        }

        .mini-table-card {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
        }

        .mini-table-card h3 {
            font-size: 0.95rem;
            color: var(--accent);
            margin-bottom: 0.75rem;
            text-align: center;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
        }

        .close-btn:hover {
            color: var(--text-primary);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span class="brand-badge">EFSA</span>
            <h1>Educación Física EFSA</h1>
        </div>
        <button class="btn-outline" id="openModalBtn">Ver Baremos Completos</button>
    </header>

    <main class="main-grid">
        <!-- Panel de Ingreso y Resultado -->
        <section class="card">
            <div class="card-title">Evaluación Individual</div>

            <div class="form-group">
                <label>Género</label>
                <div class="gender-selector">
                    <button type="button" class="gender-btn active" data-gender="M">Masculino</button>
                    <button type="button" class="gender-btn" data-gender="F">Femenino</button>
                </div>
            </div>

            <div class="form-group">
                <label for="testSelect">Prueba Física</label>
                <select id="testSelect">
                    <option value="abdominales">Abdominales</option>
                    <option value="flexiones">Flexoextensiones de brazos</option>
                    <option value="1125mts">1125 mts.</option>
                    <option value="circuito">Circuito</option>
                </select>
            </div>

            <div class="form-group">
                <label for="scoreInput" id="inputLabel">Cantidad de repeticiones</label>
                <input type="text" id="scoreInput" placeholder="Ej: 45" autocomplete="off">
                <div class="helper-text" id="helperText">Ingresá un número entero de repeticiones.</div>
            </div>

            <div class="result-box" id="resultBox">
                <div class="result-label">Calificación Obtenida</div>
                <div class="grade-display" id="gradeDisplay">-</div>
                <div class="grade-status" id="gradeStatus">Esperando dato...</div>
                <div class="grade-detail" id="gradeDetail">Seleccioná género, prueba e ingresá la marca.</div>
            </div>
        </section>

        <!-- Tabla de Tabulación Activa -->
        <section class="card">
            <div class="card-title">
                <span id="activeTableTitle">Tabulación: Abdominales (Masculino)</span>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th id="colMetricHeader">Cantidades</th>
                            <th>Nota</th>
                        </tr>
                    </thead>
                    <tbody id="activeTableBody">
                        <!-- Filas generadas dinámicamente -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal con todos los baremos -->
    <div class="modal-backdrop" id="baremosModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Tablas Oficiales - Educación Física EFSA</h2>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body" id="allTablesContainer">
                <!-- Se llena automáticamente -->
            </div>
        </div>
    </div>

        const genderBtns = document.querySelectorAll('.gender-btn');

        const activeTableBody = document.getElementById('activeTableBody');

        // Modal
        const modal = document.getElementById('baremosModal');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');

        // Convertir texto de tiempo ("3:45" o "225") a segundos totales
        function parseTimeToSeconds(val) {
            const clean = val.trim();
            if (!clean) return null;

            if (clean.includes(':')) {
                const parts = clean.split(':');
                if (parts.length !== 2) return null;
                const mins = parseInt(parts[0], 10);
                const secs = parseFloat(parts[1].replace(',', '.'));
                if (isNaN(mins) || isNaN(secs) || mins < 0 || secs < 0 || secs >= 60) return null;
                return (mins * 60) + secs;
            } else {
                const num = parseFloat(clean.replace(',', '.'));
                if (isNaN(num) || num < 0) return null;
                return num;
            }
        }

        function formatSeconds(totalSec) {
            const m = Math.floor(totalSec / 60);
            const s = Math.round(totalSec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // Actualizar textos de ayuda según prueba
        function updateInputUI() {
            const testObj = BAREMOS[currentTest];
            if (testObj.tipo === 'reps') {
                inputLabel.textContent = 'Cantidad de repeticiones';
                scoreInput.placeholder = currentTest === 'abdominales' ? 'Ej: 45' : 'Ej: 38';
                helperText.textContent = 'Ingresá la cantidad exacta de repeticiones realizadas.';
                colMetricHeader.textContent = 'Cantidades';
            } else {
                inputLabel.textContent = 'Tiempo registrado (mm:ss o segundos)';
                scoreInput.placeholder = currentTest === '1125mts' ? 'Ej: 4:15' : 'Ej: 1:02';
                helperText.textContent = 'Podés escribir minutos:segundos (ej: 4:15) o segundos totales (ej: 255).';
                colMetricHeader.textContent = 'Tiempo';
            }
        }

        // Renderizar la tabla lateral activa
        function renderActiveTable(matchedNota = null) {
            const testObj = BAREMOS[currentTest];
            const rows = testObj[currentGender];
            const genderText = currentGender === 'M' ? 'Masculino' : 'Femenino';
            activeTableTitle.textContent = `Tabulación: ${testObj.nombre} (${genderText})`;

            activeTableBody.innerHTML = '';
            rows.forEach(row => {
                const tr = document.createElement('tr');
                if (matchedNota !== null && row.nota === matchedNota) {
                    tr.className = row.nota === 0 ? 'highlight-row-zero' : 'highlight-row';
                }
                tr.innerHTML = `
                    <td>${row.texto}</td>
                    <td><strong>${row.nota}</strong></td>
                `;
                activeTableBody.appendChild(tr);
            });
        }

        // Evaluar el dato ingresado
        function evaluateScore() {
            const rawVal = scoreInput.value.trim();
            const testObj = BAREMOS[currentTest];
            const rows = testObj[currentGender];

            if (!rawVal) {
                gradeDisplay.textContent = '-';
                gradeDisplay.style.color = 'var(--text-secondary)';
                gradeStatus.textContent = 'Esperando dato...';
                gradeStatus.style.background = 'rgba(148, 163, 184, 0.15)';
                gradeStatus.style.color = 'var(--text-secondary)';
                gradeDetail.textContent = 'Ingresá una marca para obtener la calificación.';
                renderActiveTable(null);
                return;
            }

            let numericValue = null;

            if (testObj.tipo === 'reps') {
                if (!/^\d+$/.test(rawVal)) {
                    showInvalid('Ingresá solo números enteros para repeticiones.');
                    return;
                }
                numericValue = parseInt(rawVal, 10);
            } else {
                numericValue = parseTimeToSeconds(rawVal);
                if (numericValue === null) {
                    showInvalid('Formato de tiempo inválido. Usá mm:ss (ej: 4:10) o segundos.');
                    return;
                }
            }

            // Buscar en el baremo correspondiente
            let foundRow = null;
            for (const r of rows) {
                if (numericValue >= r.min && numericValue <= r.max) {
                    foundRow = r;
                    break;
                }
            }

            // Respaldo de seguridad
            if (!foundRow) {
                foundRow = rows[rows.length - 1];
            }

            const nota = foundRow.nota;
            gradeDisplay.textContent = nota;

            // Estilos visuales según calificación
            if (nota === 0) {
                gradeDisplay.style.color = 'var(--danger)';
                gradeStatus.textContent = 'Sin puntaje (0)';
                gradeStatus.style.background = 'rgba(239, 68, 68, 0.18)';
                gradeStatus.style.color = 'var(--danger)';
            } else if (nota < 4) {
                gradeDisplay.style.color = 'var(--warning)';
                gradeStatus.textContent = 'Desaprobado';
                gradeStatus.style.background = 'rgba(245, 158, 11, 0.18)';
                gradeStatus.style.color = 'var(--warning)';
            } else if (nota < 7) {
                gradeDisplay.style.color = 'var(--accent)';
                gradeStatus.textContent = 'Aprobado';
                gradeStatus.style.background = 'rgba(56, 189, 248, 0.18)';
                gradeStatus.style.color = 'var(--accent)';
            } else {
                gradeDisplay.style.color = 'var(--success)';
                gradeStatus.textContent = nota === 10 ? 'Excelente' : 'Muy Bueno';
                gradeStatus.style.background = 'rgba(34, 197, 94, 0.18)';
                gradeStatus.style.color = 'var(--success)';
            }

            const marcaTexto = testObj.tipo === 'reps'
                ? `${numericValue} repeticiones`
                : `${formatSeconds(numericValue)} (${numericValue} seg)`;

            gradeDetail.textContent = `Marca evaluada: ${marcaTexto} • Rango: ${foundRow.texto}`;
            renderActiveTable(nota);
        }

        function showInvalid(msg) {
            gradeDisplay.textContent = '!';
            gradeDisplay.style.color = 'var(--warning)';
            gradeStatus.textContent = 'Dato no válido';
            gradeStatus.style.background = 'rgba(245, 158, 11, 0.18)';
            gradeStatus.style.color = 'var(--warning)';
            gradeDetail.textContent = msg;
            renderActiveTable(null);
        }

        // Generar todas las tablas en el modal
        function renderAllBaremosModal() {
            allTablesContainer.innerHTML = '';
            Object.keys(BAREMOS).forEach(key => {
                const test = BAREMOS[key];
                const card = document.createElement('div');
                card.className = 'mini-table-card';

                let rowsHtml = '';
                for (let i = 0; i < test.M.length; i++) {
                    rowsHtml += `
                        <tr>
                            <td>${test.M[i].texto}</td>
                            <td><strong>${test.M[i].nota}</strong></td>
                            <td>${test.F[i].texto}</td>
                        </tr>
                    `;
                }

                card.innerHTML = `
                    <h3>${test.nombre}</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Masculino</th>
                                <th>Nota</th>
                                <th>Femenino</th>
                            </tr>
                        </thead>
                        <tbody>${rowsHtml}</tbody>
                    </table>
                `;
                allTablesContainer.appendChild(card);
            });
        }

        // Eventos
        genderBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                genderBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentGender = btn.dataset.gender;
                evaluateScore();
            });
        });

        testSelect.addEventListener('change', (e) => {
            currentTest = e.target.value;
            scoreInput.value = '';
            updateInputUI();
            evaluateScore();
        });

        scoreInput.addEventListener('input', evaluateScore);

        openModalBtn.addEventListener('click', () => {
            renderAllBaremosModal();
            modal.classList.add('open');
        });

        closeModalBtn.addEventListener('click', () => {
            modal.classList.remove('open');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('open');
        });

        // Inicializar
        updateInputUI();
        renderActiveTable();
    </script>

    <!-- Registro del Service Worker para habilitar instalación en dispositivos móviles -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .catch(err => console.log('Error al registrar SW:', err));
        });
      }
    </script>
